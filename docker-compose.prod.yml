# docker-compose.prod.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires: POSTGRES_PASSWORD environment variable (set in .env file or shell)

services:
  hygmap-db:
    # Use alternate port to avoid conflict with host PostgreSQL.
    # Only accessible from localhost; containers use internal Docker networking.
    #
    # !override is load-bearing. Compose MERGES port lists across files rather than
    # replacing them, so without it the base file's public "5432:5432" survived alongside
    # this entry and Postgres stayed exposed on every interface — the exact opposite of
    # what the comment above claimed. Verified 2026-07-29 with `docker compose config`.
    ports: !override
      - "127.0.0.1:15432:5432"
    restart: always

  hygmap-php:
    restart: always
    environment:
      - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d:/usr/local/etc/php/production.d

  hygmap-api:
    build:
      context: ./hygmap-api
      dockerfile: Dockerfile.prod
    # Bind to loopback only, so the API is reachable exclusively through the nginx vhost
    # (docs/digitalocean-deployment.md proxies api.hygmap.space to 127.0.0.1:8000).
    #
    # This overrides the base file's public "8000:8000". Two reasons it matters:
    #   1. A publicly bound API bypasses nginx, and therefore TLS and anything else
    #      configured at that layer.
    #   2. It is the precondition for FORWARDED_ALLOW_IPS below. Trusting a forwarded
    #      client IP is only safe when the sender cannot be an arbitrary internet client.
    # If you republish this port, remove FORWARDED_ALLOW_IPS at the same time.
    #
    # !override is required: Compose merges port lists rather than replacing them, so a
    # plain `ports:` here would leave the base file's public "8000:8000" in place and the
    # loopback binding would be decorative.
    ports: !override
      - "127.0.0.1:8000:8000"
    volumes: []  # No volume mounts in production
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hygmap_user}:${POSTGRES_PASSWORD}@hygmap-db:5432/${POSTGRES_DB:-hygmap}
      - DEBUG=False
      - CORS_ORIGINS=${CORS_ORIGINS_PROD:-https://hygmap.space,https://new.hygmap.space}
      # Trust X-Forwarded-For from the Docker bridge gateway -- that is, from nginx --
      # so per-IP rate limiting sees the real caller.
      #
      # Without any value here, uvicorn only trusts 127.0.0.1, which is never the peer
      # inside a container: every request arrives from the gateway, so slowapi counted
      # all callers as one client and the per-IP limit was a single shared bucket.
      # Verified 2026-07-29: every request logged client_ip 172.20.0.1 regardless of
      # origin.
      #
      # This MUST NOT be `*`, which it was until 2026-07-30. Traced through the
      # installed uvicorn 0.27.0 (middleware/proxy_headers.py): with `*`,
      # get_trusted_client_host returns x_forwarded_for_hosts[0] -- the FIRST entry.
      # nginx's $proxy_add_x_forwarded_for APPENDS the real peer, so the first entry is
      # whatever the caller sent. Measured against a live stack: 12 requests with 12
      # forged X-Forwarded-For values all returned 200 under a 5/minute limit, while a
      # caller sending an honest header was cut off at 5. Rate limiting was defeatable
      # by anyone who knew to set a header.
      #
      # With a specific address, uvicorn instead scans the header right-to-left and
      # takes the last entry that is not a trusted host -- the address nginx appended,
      # which the caller cannot control. Re-measured after the change: forged rotation
      # shares one bucket and is cut off at 5; a genuinely different client still gets
      # its own bucket.
      #
      # The gateway address is pinned in docker-compose.yml (networks.default.ipam).
      # uvicorn matches this by exact string, not CIDR, so it cannot be a subnet.
      #
      # Still safe only because the port above is bound to loopback: the sole thing that
      # can open a connection is the local nginx. See the warning on the ports entry.
      - FORWARDED_ALLOW_IPS=172.20.0.1
    restart: always

  hygmap-frontend:
    build:
      context: ./hygmap-frontend
      dockerfile: Dockerfile.prod
    # !override for the same reason as the other services: without it the base file's
    # "5173:5173" was still published in production. 5173 is the dev Vite port, and the
    # production image serves nginx on 80 instead, so it was an open port with nothing
    # useful behind it. Verified 2026-07-29 with `docker compose config`.
    ports: !override
      - "3000:80"  # nginx serves on 80 inside container, expose as 3000
    volumes: []  # No volume mounts in production
    restart: always
